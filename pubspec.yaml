name: focus_planner
description: A premium, minimalist workspace companion and daily planner with iOS-inspired aesthetics, dark slate task cards, and custom canvas progress rings.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  firebase_core: ^2.15.0
  firebase_crashlytics: ^3.3.3
  firebase_auth: ^4.10.0
  google_sign_in: ^6.1.5
  fl_chart: ^0.63.0
  cloud_firestore: ^4.9.1
  workmanager: ^0.5.2
  connectivity_plus: ^5.0.2
  uuid: ^4.1.0
  flutter_ringtone_player: ^3.2.0
  flutter_windowmanager: ^0.2.0
  permission_handler: ^11.0.1
  flutter_local_notifications: ^16.1.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.0
  local_auth: ^2.1.6
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
